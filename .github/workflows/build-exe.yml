name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pikepdf pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          python -m PyInstaller --onefile --windowed --name PDF-Password-Recovery pdf_password_recovery.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Password-Recovery-exe
          path: dist/PDF-Password-Recovery.exe
          compression-level: 0
